<section id="skills" class="skills-section py-5">
  <div class="container">
    <h2 class="section-title text-white text-center mb-5">Technical & Soft Skills</h2>

    <div class="skills-grid">
      <!-- Skill Category Card -->
      <div class="skill-card" *ngFor="let category of skills">
        <h4 class="category-title">{{ category.name }}</h4>
        <div class="skill-items">
          <div
            class="skill-item"
            *ngFor="let skill of category.items"
            matTooltip="{{ skill.name }}"
          >
            <i class="material-icons">{{ skill.icon }}</i>
            <span>{{ skill.name }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
