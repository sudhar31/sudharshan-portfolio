<section class="experience-section py-5" id="experience">
  <div class="container">
    <h2 class="section-title text-center mb-5">Professional Experience</h2>

    <div class="timeline">
      <div class="timeline-item" *ngFor="let exp of experiences">
        <div class="timeline-icon">
          <i class="material-icons">work</i>
        </div>
        <div class="timeline-content">
          <h4 class="role">{{ exp.role }}</h4>
          <p class="duration">{{ exp.duration }}</p>
          <p class="company"><em>{{ exp.company }}</em></p>
          <ul>
            <li *ngFor="let point of exp.points">{{ point }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
